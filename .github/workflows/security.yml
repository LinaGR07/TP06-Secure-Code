# Security pipeline for MiniShop.
# Runs SAST (Bandit), dependency audit (pip-audit), secret scanning (gitleaks),
# filesystem + container scanning (Trivy), unit tests and SBOM generation.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC: catches CVEs published after the last push
  workflow_dispatch:       # allows a manual run from the Actions tab

# Least privilege: the GITHUB_TOKEN can only read the repository.
permissions:
  contents: read
  pull-requests: read


# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SAST: static analysis of our own Python code.
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install bandit
      # Fails the job only when a HIGH severity issue is found.
      - run: bandit -r app --severity-level high

  # SCA: known vulnerabilities (CVE) in our dependencies.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r app/requirements.txt

  # Secret scanning over the git history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, a secret removed later is still in old commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Trivy: vulnerabilities, secrets and misconfigurations in the repository,
  # then in the built container image.
  # trivy-action v0.35.0 is the release that was NOT hijacked in the
  # March 2026 supply chain attack (GHSA-69fq-xp46-6x23).
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3            # pin the Trivy binary too (0.69.4-0.69.6 were malicious)
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"              # non-zero exit code = the job fails

      - name: Build image
        run: docker build -t minishop:${{ github.sha }} app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: minishop:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Unit + security tests provided with the project.
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-secret   # dummy value, the app reads it from the environment
      LOGIN_RATE_LIMIT: 100/minute            # the test suite logs in many times in a row
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The lockfile has hashes, so pip runs in --require-hashes mode:
      # it cannot be mixed with unhashed packages in the same command.
      - run: pip install --require-hashes -r app/requirements.txt
      - run: pip install pytest
      - run: pytest -q tests

  # SBOM: inventory of every dependency (CycloneDX format), kept as an artifact.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py requirements app/requirements.txt --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json